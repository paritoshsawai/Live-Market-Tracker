    <!-- Critical CSS: inline skeleton visible before JS boots -->
    <style>
      /* ---------- skeleton shell (dark default) ---------- */
      .skeleton-shell{display:flex;flex-direction:column;height:100vh;background:#121211;font-family:'Space Grotesk','Avenir Next','Segoe UI',sans-serif;overflow:hidden}
      .skeleton-header{display:flex;align-items:center;justify-content:space-between;height:46px;padding:9px 18px;background:#1c1a17;border-bottom:1px solid #38332d;flex-shrink:0}
      .skeleton-header-left{display:flex;align-items:center;gap:12px}
      .skeleton-header-right{display:flex;align-items:center;gap:12px}
      .skeleton-pill{height:24px;border-radius:999px;background:#25211d}
      .skeleton-dot{width:8px;height:8px;border-radius:50%;background:#84b58d}
      .skeleton-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#121211}
      .skeleton-map{height:50vh;min-height:200px;border:1px solid #38332d;background:#141613;display:flex;flex-direction:column;flex-shrink:0;border-radius:14px;overflow:hidden}
      .skeleton-map-bar{height:38px;display:flex;align-items:center;padding:0 14px;background:#1c1a17;border-bottom:1px solid #38332d}
      .skeleton-map-body{flex:1;position:relative;overflow:hidden}
      .skeleton-map-body::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 50%,#2a302a 0%,#141613 100%);opacity:.5}
      .skeleton-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px;padding:4px;align-content:start}
      .skeleton-panel{height:320px;background:#1b1916;border:1px solid #38332d;border-radius:10px;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(5,4,3,.12)}
      .skeleton-panel-header{height:40px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #26231f;background:linear-gradient(180deg,#211d19 0%,#1b1916 100%)}
      .skeleton-panel-body{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px}
      .skeleton-line{height:14px;border-radius:999px;background:linear-gradient(90deg,rgba(255,245,230,.05) 25%,rgba(255,245,230,.1) 50%,rgba(255,245,230,.05) 75%);background-size:200% 100%;animation:skel-shimmer 1.5s infinite}
      .skeleton-line.w75{width:75%}.skeleton-line.w60{width:60%}.skeleton-line.w50{width:50%}.skeleton-line.w85{width:85%}.skeleton-line.w40{width:40%}

      @keyframes skel-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

      /* ---------- skeleton shell (light theme) ---------- */
      [data-theme="light"] .skeleton-shell{background:#f5f0e8}
      [data-theme="light"] .skeleton-header{background:#fffdf8;border-bottom-color:#d2c5b5}
      [data-theme="light"] .skeleton-pill{background:#f4ece2}
      [data-theme="light"] .skeleton-dot{background:#84b58d}
      [data-theme="light"] .skeleton-main{background:#f5f0e8}
      [data-theme="light"] .skeleton-map{border-color:#d2c5b5;background:#e9ece7}
      [data-theme="light"] .skeleton-map-bar{background:#fffdf8;border-bottom-color:#d2c5b5}
      [data-theme="light"] .skeleton-map-body::after{background:radial-gradient(ellipse 60% 50% at 50% 50%,#c7cec4 0%,#e9ece7 100%)}

      [data-variant="happy"] .skeleton-header{background:#FFFFFF;border-bottom-color:#DDD9CF}

    <!-- Force-clear stale service worker if module scripts 404 (post-deploy cache mismatch) -->
    <script>
    (function(){
      if(!('serviceWorker' in navigator))return;
      var key='wm-sw-nuke';
      if(sessionStorage.getItem(key))return;
      window.addEventListener('error',function(e){
        var u=e.target&&(e.target.src||e.target.href)||'';
        if(u&&/\/assets\//.test(u)){
          sessionStorage.setItem(key,'1');
          navigator.serviceWorker.getRegistrations().then(function(regs){
            var p=regs.map(function(r){return r.unregister()});
            Promise.all(p).then(function(){
              if(caches&&caches.keys){
                caches.keys().then(function(ks){
                  return Promise.all(ks.map(function(k){return caches.delete(k)}));
                }).then(function(){location.reload()});
              }else{location.reload()}
            });
          });
        }
      },true);
    })()
    </script>
